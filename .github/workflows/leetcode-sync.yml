name: LeetCode Sync

on:
  schedule:
    # Every 15 minutes. GitHub does not guarantee exact timing for schedule
    # triggers (low-traffic repos can see delays of several minutes to ~1hr),
    # so this is "near real-time", not truly instant.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Serializes runs so two overlapping schedules never race on sync_state.json.
concurrency:
  group: leetcode-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: sync/requirements.txt

      - name: Install dependencies
        run: pip install -r sync/requirements.txt

      - name: Run sync
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          LEETCODE_USERNAME: ${{ secrets.LEETCODE_USERNAME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python sync/main.py

      - name: Persist sync state
        if: always()
        run: |
          git config user.name "leetcode-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet -- sync/sync_state.json; then
            git add sync/sync_state.json
            git commit -m "chore: update sync state"
            # Conflict-safe: rebase onto any commits that landed while this
            # run was in progress, then push. Retries a few times in the
            # unlikely case of a second near-simultaneous push.
            for i in 1 2 3; do
              git pull --rebase && git push && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          else
            echo "No state changes to commit."
          fi
